[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hapax-spine"
version = "0.1.3"
description = "Source-available runtime mechanism (append-only event ledger, dispatch-policy evaluator, capability registry and receipts, quota arithmetic, EDT measurement, and projections) for Hapax Research Lab's governed agent-delivery system."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Hapax Research Lab", email = "hrl-han@hapaxresearch.com" }]
keywords = ["sdlc", "agent-orchestration", "capability-routing", "dispatch", "governance", "witnessed-ledger"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "License :: Other/Proprietary License",
]
dependencies = ["pydantic>=2", "pyyaml>=6"]

[project.urls]
Homepage = "https://hapaxresearch.com"
Repository = "https://github.com/hapax-systems/hapax-spine"

[tool.hatch.build.targets.wheel]
packages = ["src/hapax"]

[tool.hatch.metadata]
allow-direct-references = true
