[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hapax-spine"
version = "0.1.0"
description = "The SDLC-runtime mechanism (coord ledger, dispatch policy, capability registry, EDT, quota, gate events) extracted from hapax-council — instance taxonomy injected, not baked."
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "pyyaml>=6"]

# The suite has always needed pytest; it was never declared, so `uv run pytest` in a fresh
# checkout failed and CI never ran the tests at all. Declared here so the suite is runnable
# from the project's own metadata.
[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/hapax"]

[tool.hatch.metadata]
allow-direct-references = true
