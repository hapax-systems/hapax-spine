name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  metadata-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Validate support metadata
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          config = yaml.safe_load(Path(".github/ISSUE_TEMPLATE/config.yml").read_text())
          assert config["blank_issues_enabled"] is False
          assert len(config["contact_links"]) == 4
          assert Path("SUPPORT.md").is_file()
          PY

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install .
      - name: Import package
        run: python -c "import hapax.spine"

  all-green:
    name: all-green
    runs-on: ubuntu-latest
    needs:
      - metadata-smoke
      - package-smoke
    if: always()
    steps:
      - name: Require required jobs to pass
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          if [ "$RESULTS" != "success,success" ]; then
            echo "::error::Required job results: $RESULTS"
            exit 1
          fi
